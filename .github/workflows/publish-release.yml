name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified version tag
        required: true
        default: v1.1.0
permissions:
  contents: write
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build, load, verify and upload draft assets
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node ../tooling/deploy/publish-release.mjs
