name: Workbench checks and containers

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      capacity:
        description: Run isolated 1000-account capacity verification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify source-compatible Shell deployment entry
        run: python -m unittest discover -s tests -p 'test_shell_deploy.py' -v
      - name: Test verified image deployment, reruns, backups and failed downloads
        run: python tests/deploy_smoke.py --dir "$RUNNER_TEMP/deploy-check" --project four-deploy-check-ci --port 18080 --direct --shell-source
      - name: Keep sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification
          path: ${{ runner.temp }}/deploy-check/smoke-result.json
          if-no-files-found: ignore
      - name: Stop isolated deployment
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/deploy-check/state.json" ]; then
            release_dir=$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"deploy-check/state.json")))["releaseDir"])')
            docker compose --project-name four-deploy-check-ci --env-file "$RUNNER_TEMP/deploy-check/.env.production" -f "$release_dir/compose.production.yaml" --profile database down
          fi
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up deployment script runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify repeatable deployment and safe downloads
        run: python -m unittest discover -s tests -p 'test_auto_deploy.py' -v

      - name: Prepare isolated test configuration
        run: node deploy/init-env.mjs

      - name: Start PostgreSQL
        run: docker compose up -d --wait --wait-timeout 120 db

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Lint, typecheck and build
        run: npm run check

      - name: Exercise real database and employee login flows
        run: npm run test:integration

      - name: Build application images
        run: docker compose build
        env:
          SOURCE_REVISION: ${{ github.sha }}

      - name: Start the composed application
        run: docker compose up -d --wait --wait-timeout 180

      - name: Verify container HTTP endpoints
        run: |
          node --input-type=module -e "for (const path of ['/', '/api/health']) { const response = await fetch('http://localhost:8080' + path); if (!response.ok) throw new Error(path + ': ' + response.status); console.log(path + ' ready'); }"

      - name: Exercise offline editing and account isolation in Chrome
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium)" npm run test:browser

      - name: Verify themes, installation resources and safe updates
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium)" npm run test:ui

      - name: Verify Office transfers, account management and audit UI
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium)" npm run test:features

      - name: Run optional isolated capacity verification
        if: github.event_name == 'workflow_dispatch' && inputs.capacity
        run: |
          node scripts/prepare-capacity.mjs init
          docker compose --env-file .local/stage6-capacity.env -f compose.production.yaml -f compose.capacity.yaml --profile database up -d --wait --wait-timeout 180
          node scripts/prepare-capacity.mjs connect
          npm run test:capacity

      - name: Keep browser and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-verification
          path: |
            artifacts/stage5/browser-check.json
            artifacts/stage5/*.png
            artifacts/stage6/ui/
            artifacts/admin-formats/browser/browser-check.json
            artifacts/admin-formats/browser/*.png
            artifacts/stage6/capacity.json
          if-no-files-found: ignore

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100 api migrate web db

      - name: Stop test services
        if: always()
        run: |
          if [ -f .local/stage6-capacity.env ]; then docker compose --env-file .local/stage6-capacity.env -f compose.production.yaml -f compose.capacity.yaml --profile database down; fi
          docker compose down --remove-orphans
